name: CI

on:
  push:
    branches: ['**']
  pull_request:
    branches: ['**']

jobs:
  build-test:
    runs-on: ubuntu-latest
    env:
      # For schema-changing PRs, set DATABASE_URL in repo secrets to a PlanetScale
      # dev branch URL. CI falls back to a disposable local MySQL 8 service.
      DATABASE_URL: ${{ secrets.DATABASE_URL || 'mysql://tellar:tellar@localhost:3306/tellar' }}
      JWT_SECRET: test-secret
      NODE_ENV: test

    services:
      mysql:
        image: mysql:8
        env:
          MYSQL_ROOT_PASSWORD: tellar
          MYSQL_DATABASE: tellar
          MYSQL_USER: tellar
          MYSQL_PASSWORD: tellar
        ports: ['3306:3306']
        options: >-
          --health-cmd "mysqladmin ping -h localhost -utellar -ptellar" --health-interval 10s --health-timeout 5s --health-retries 10

    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with: { version: 9.12.0 }
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: pnpm store path
        id: pnpm-cache
        shell: bash
        run: echo "STORE_PATH=$(pnpm store path --silent)" >> $GITHUB_OUTPUT
      - uses: actions/cache@v4
        with:
          path: ${{ steps.pnpm-cache.outputs.STORE_PATH }}
          key: ${{ runner.os }}-pnpm-${{ hashFiles('**/package.json') }}
          restore-keys: ${{ runner.os }}-pnpm-
      - run: pnpm install --no-frozen-lockfile
      - name: Generate Prisma client
        run: pnpm --filter @tellar/api prisma generate
      - name: Push schema
        run: pnpm --filter @tellar/api prisma db push
      - name: Typecheck backend
        run: pnpm --filter @tellar/api lint
      - name: Test backend with coverage
        run: pnpm --filter @tellar/api test:cov -- --passWithNoTests
      - name: Build backend
        run: pnpm --filter @tellar/api build
      - name: Build frontend
        run: pnpm --filter @tellar/web build
      - name: Upload coverage
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-api
          path: apps/api/coverage
          if-no-files-found: ignore

      - name: Validate OpenAPI spec
        run: npx -y @redocly/cli lint openapi.yaml

      - name: CDK synth & test
        working-directory: infra
        env:
          CDK_DEFAULT_ACCOUNT: '000000000000'
          CDK_DEFAULT_REGION: us-east-1
        run: |
          npm install --no-audit --no-fund
          npx tsc --noEmit
          npx jest --passWithNoTests
          npx cdk synth -c env=staging || true
