# Local LLM side-car. Compose overlay that runs Ollama in a container next to
# the main Tellar dev services. Launch with either:
#
#   docker compose -f docker-compose.yml -f docker-compose.ollama.yml up -d
#
# or just this file alone if you only want Ollama:
#
#   docker compose -f docker-compose.ollama.yml up -d
#
# Then set in apps/api/.env:
#
#   OPENAI_BASE_URL="http://localhost:11434/v1"
#   OPENAI_MODEL="qwen2.5:7b-instruct"         # or whatever you pulled
#   OPENAI_EMBED_MODEL="nomic-embed-text"      # optional, for KB embeddings
#
# The `ollama-pull` service pre-downloads the default models on first boot so
# you don't wait on your first API request. Override via env if you want
# different models:
#
#   OLLAMA_CHAT_MODEL=qwen2.5:14b-instruct OLLAMA_EMBED_MODEL=mxbai-embed-large \
#     docker compose -f docker-compose.ollama.yml up -d

version: '3.9'

services:
  ollama:
    image: ollama/ollama:latest
    container_name: tellar-ollama
    ports:
      - '11434:11434'
    volumes:
      - ollama-models:/root/.ollama
    restart: unless-stopped
    # Uncomment the deploy block on Linux hosts with nvidia-container-toolkit.
    # On macOS / Windows, the container runs CPU-only — fine for 7B models.
    #
    # deploy:
    #   resources:
    #     reservations:
    #       devices:
    #         - driver: nvidia
    #           count: all
    #           capabilities: [gpu]
    healthcheck:
      test: ['CMD', 'ollama', 'list']
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 30s

  # One-shot sidecar that pulls the default models, then exits. Uses the same
  # Ollama image so the CLI is already there.
  ollama-pull:
    image: ollama/ollama:latest
    container_name: tellar-ollama-pull
    depends_on:
      ollama:
        condition: service_healthy
    environment:
      - OLLAMA_HOST=http://ollama:11434
      - OLLAMA_CHAT_MODEL=${OLLAMA_CHAT_MODEL:-qwen2.5:7b-instruct}
      - OLLAMA_EMBED_MODEL=${OLLAMA_EMBED_MODEL:-nomic-embed-text}
    entrypoint: ['/bin/sh', '-c']
    command:
      - |
        echo "[pull] chat  = $${OLLAMA_CHAT_MODEL}"
        echo "[pull] embed = $${OLLAMA_EMBED_MODEL}"
        ollama pull $${OLLAMA_CHAT_MODEL} || true
        ollama pull $${OLLAMA_EMBED_MODEL} || true
        echo "[pull] done"
    restart: 'no'

volumes:
  ollama-models:
